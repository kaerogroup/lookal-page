<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f1f22">
  <meta name="robots" content="noindex,nofollow">
  <title>LOOKaL Location Pin — Disabled</title>
  <style>
    :root{--bg:#1f1f22;--panel:#29282c;--line:#454249;--text:#f7f3ee;--muted:#aaa5ad;--red:#ef3340}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    .card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
    .eyebrow{color:#ff7b84;text-transform:uppercase;font-size:.72rem;font-weight:900;letter-spacing:.12em}
    h1{margin:.55rem 0 .7rem;font-size:clamp(1.8rem,5vw,2.7rem);letter-spacing:-.045em}
    p{margin:0;color:#c7c2c8;line-height:1.6}
    a{display:inline-flex;margin-top:20px;text-decoration:none;background:var(--red);color:#fff;font-weight:900;padding:12px 15px;border-radius:11px}
  </style>
</head>
<body>
  <main class="card">
    <span class="eyebrow">Internal tool</span>
    <h1>Pin Lokasi ditutup sementara.</h1>
    <p>Batch lokasi semasa telah selesai. Tool ini akan dibuka semula apabila batch lokasi seterusnya bermula.</p>
    <a href="/">Kembali ke LOOKaL</a>
  </main>
</body>
</html>
